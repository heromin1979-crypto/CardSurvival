<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combat Monster FX Preview</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/screens-combat.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 10%, rgba(200, 160, 96, 0.12), transparent 32%),
        linear-gradient(180deg, #070604 0%, #11100d 54%, #050403 100%);
      color: var(--text-primary);
      font-family: var(--font-body);
    }

    .preview-wrap {
      width: min(1180px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 34px 0 42px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(200, 160, 96, 0.28);
      margin-bottom: 24px;
    }

    .preview-title {
      margin: 0;
      color: var(--accent-primary);
      font-size: 22px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .preview-note {
      margin: 7px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 18px;
    }

    .fx-card {
      position: relative;
      min-height: 260px;
      background:
        linear-gradient(180deg, rgba(22, 18, 13, 0.92), rgba(5, 4, 3, 0.95)),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 42px);
      border: 1px solid rgba(200, 160, 96, 0.34);
      box-shadow: inset 0 0 42px rgba(0,0,0,0.72), 0 10px 28px rgba(0,0,0,0.38);
      overflow: hidden;
    }

    .fx-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.08), transparent 18%),
        radial-gradient(circle at 50% 64%, rgba(224, 80, 80, 0.12), transparent 28%);
      pointer-events: none;
    }

    .dummy-target {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 72px;
      height: 122px;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle at 50% 18%, #191715 0 18px, transparent 19px),
        linear-gradient(180deg, #27231f 0 48%, #151210 49% 100%);
      border: 1px solid rgba(200, 160, 96, 0.32);
      box-shadow: 0 18px 24px rgba(0,0,0,0.58);
    }

    .dummy-target::after {
      content: "";
      position: absolute;
      left: -36px;
      right: -36px;
      bottom: -18px;
      height: 18px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 70%);
    }

    .dummy-target .cv-fx {
      opacity: 1 !important;
      animation: none !important;
      transform: translate(-50%, -50%) scale(1) !important;
    }

    .fx-label {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 17px;
      display: grid;
      gap: 5px;
      padding-top: 13px;
      border-top: 1px solid rgba(200, 160, 96, 0.24);
    }

    .fx-label strong {
      color: var(--text-warn);
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .fx-label span {
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      .preview-grid { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
    }
  </style>
</head>
<body id="screen-combat" class="combat-focused">
  <main class="preview-wrap">
    <header class="preview-header">
      <div>
        <h1 class="preview-title">Monster Hit FX v2</h1>
        <p class="preview-note">Actual CSS classes used by combat impact overlays.</p>
      </div>
      <p class="preview-note">claw / rupture / slam / acid / shock</p>
    </header>

    <section class="preview-grid">
      <article class="fx-card">
        <div class="dummy-target"><div class="cv-fx cv-fx-claw"></div></div>
        <div class="fx-label"><strong>Claw</strong><span>할퀴는 삼중 상처, 일반 좀비/개 계열 기본 타격</span></div>
      </article>
      <article class="fx-card">
        <div class="dummy-target"><div class="cv-fx cv-fx-rupture"></div></div>
        <div class="fx-label"><strong>Rupture</strong><span>팡 터지는 살점/파열감, 폭발/방사 계열 타격</span></div>
      </article>
      <article class="fx-card">
        <div class="dummy-target"><div class="cv-fx cv-fx-slam"></div></div>
        <div class="fx-label"><strong>Slam</strong><span>둔중한 충격파, 거대/브루트 계열 타격</span></div>
      </article>
      <article class="fx-card">
        <div class="dummy-target"><div class="cv-fx cv-fx-acid"></div></div>
        <div class="fx-label"><strong>Acid</strong><span>녹색 산성 비산, 부식/독성 계열 타격</span></div>
      </article>
      <article class="fx-card">
        <div class="dummy-target"><div class="cv-fx cv-fx-shock"></div></div>
        <div class="fx-label"><strong>Shock</strong><span>강한 돌진 충돌, 차저 특수 강타</span></div>
      </article>
    </section>
  </main>
</body>
</html>
